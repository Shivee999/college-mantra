<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>College Mantra</title>
<meta name="description" content="Every College Mantra link, in one place." />
<meta name="theme-color" content="#0B0E1A" />
<meta property="og:type" content="website" />
<meta property="og:title" content="College Mantra" />
<meta property="og:description" content="Every link, one place." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<style>
  :root{
    --night:#0B0E1A;
    --night-2:#121729;
    --vault:#0A0D18;
    --parchment:#E8DCC0;
    --parchment-dim:#A9A088;
    --gold:#C9A227;
    --candle:#F5C557;
    --oxblood:#6B1F2A;
    --verdigris:#2E5E4E;

    --rule:rgba(201,162,39,.22);
    --rule-soft:rgba(201,162,39,.10);

    --display:"IM Fell English","Georgia",serif;
    --sc:"IM Fell English SC","Georgia",serif;
    --body:"EB Garamond","Georgia",serif;

    --gutter:22px;
  }

  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}

  body{
    margin:0;
    min-height:100svh;
    background:var(--night);
    color:var(--parchment);
    font-family:var(--body);
    font-size:17px;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    position:relative;
  }

  /* the great hall: vaulted dark, warm from below */
  .hall{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(70vw 50vh at 50% 108%, rgba(201,162,39,.18), transparent 62%),
      radial-gradient(50vw 40vh at 12% -8%, rgba(46,94,78,.16), transparent 60%),
      radial-gradient(46vw 38vh at 92% 4%, rgba(107,31,42,.20), transparent 62%),
      linear-gradient(180deg, var(--vault), var(--night) 45%, #0D1120 100%);
  }
  /* dust motes in candlelight */
  .motes{
    position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.5;
    background-image:
      radial-gradient(1.4px 1.4px at 12% 22%, rgba(245,197,87,.9), transparent),
      radial-gradient(1.1px 1.1px at 78% 14%, rgba(232,220,192,.8), transparent),
      radial-gradient(1.6px 1.6px at 34% 66%, rgba(245,197,87,.7), transparent),
      radial-gradient(1.2px 1.2px at 62% 82%, rgba(232,220,192,.6), transparent),
      radial-gradient(1.3px 1.3px at 88% 58%, rgba(245,197,87,.65), transparent),
      radial-gradient(1px 1px at 22% 44%, rgba(232,220,192,.7), transparent),
      radial-gradient(1.5px 1.5px at 50% 30%, rgba(245,197,87,.5), transparent);
    animation:motes 22s ease-in-out infinite alternate;
  }
  @keyframes motes{
    from{transform:translate3d(0,0,0)}
    to{transform:translate3d(14px,-22px,0)}
  }

  /* floating candles */
  .candles{position:fixed;inset:0;z-index:1;pointer-events:none}
  .candle{position:absolute;width:7px}
  .stick{
    display:block;width:7px;height:26px;border-radius:2px;
    background:linear-gradient(180deg,#F0E6CE,#C9BFA4 60%,#8F866E);
    box-shadow:0 0 12px rgba(245,197,87,.25);
  }
  .flame{
    display:block;width:7px;height:11px;margin:0 auto 2px;
    border-radius:50% 50% 45% 45%;
    background:radial-gradient(circle at 50% 68%, #FFF3CE, #F5C557 42%, rgba(245,197,87,0) 72%);
    filter:blur(.3px);
    transform-origin:50% 100%;
    animation:flicker 2.6s ease-in-out infinite;
  }
  .halo{
    position:absolute;left:50%;top:-16px;width:52px;height:52px;
    transform:translateX(-50%);border-radius:50%;
    background:radial-gradient(circle, rgba(245,197,87,.30), transparent 68%);
    animation:halo 2.6s ease-in-out infinite;
  }
  @keyframes flicker{
    0%,100%{transform:scaleY(1) skewX(0deg);opacity:1}
    30%{transform:scaleY(1.16) skewX(-3deg);opacity:.92}
    55%{transform:scaleY(.94) skewX(2deg);opacity:1}
    78%{transform:scaleY(1.08) skewX(-1deg);opacity:.95}
  }
  @keyframes halo{
    0%,100%{opacity:.55;transform:translateX(-50%) scale(1)}
    45%{opacity:.85;transform:translateX(-50%) scale(1.14)}
  }
  .bob{animation:bob 7s ease-in-out infinite alternate}
  @keyframes bob{
    from{transform:translateY(0)}
    to{transform:translateY(-16px)}
  }

  /* FLYING BOOKS - the signature */
  .flock{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    perspective:900px;
  }
  .flyer{
    position:absolute;top:0;left:0;
    transform-style:preserve-3d;
    animation-name:cross;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
    will-change:transform;
  }
  .book{
    position:relative;
    transform-style:preserve-3d;
    animation:tumble 9s ease-in-out infinite alternate;
  }
  .spine{
    position:absolute;left:50%;top:2%;
    width:4px;height:96%;
    transform:translateX(-50%) translateZ(0);
    background:linear-gradient(180deg,#8A2A38,#541822);
    border-radius:1px;
    box-shadow:0 0 8px rgba(0,0,0,.55), 0 0 14px rgba(245,197,87,.18);
  }
  /* the two covers, hinged at the spine - real 3D wings */
  .wing{
    position:absolute;top:0;
    width:50%;height:100%;
    background:
      linear-gradient(100deg, rgba(255,240,190,.16), rgba(0,0,0,.20)),
      linear-gradient(180deg,#F6EDD4,#DCCBA2);
    border:1px solid rgba(150,118,52,.5);
    box-shadow:0 2px 10px rgba(0,0,0,.45), 0 0 16px rgba(245,197,87,.10);
    backface-visibility:visible;
  }
  .wing.l{
    right:50%;transform-origin:right center;
    border-radius:3px 1px 1px 3px;
    animation:flapL 1.5s ease-in-out infinite;
  }
  .wing.r{
    left:50%;transform-origin:left center;
    border-radius:1px 3px 3px 1px;
    animation:flapR 1.5s ease-in-out infinite;
  }
  .leaf{
    position:absolute;top:6%;height:88%;width:44%;
    background:repeating-linear-gradient(90deg,#FBF6E8 0 2px,#E4DAC0 2px 3px);
    opacity:.95;
  }
  .leaf.l{right:50%;transform-origin:right center;animation:flapL 1.5s ease-in-out infinite}
  .leaf.r{left:50%;transform-origin:left center;animation:flapR 1.5s ease-in-out infinite}

  @keyframes flapL{
    0%,100%{transform:rotateY(-58deg)}
    50%{transform:rotateY(-16deg)}
  }
  @keyframes flapR{
    0%,100%{transform:rotateY(58deg)}
    50%{transform:rotateY(16deg)}
  }
  @keyframes tumble{
    from{transform:rotateZ(-11deg) rotateX(16deg)}
    to{transform:rotateZ(13deg) rotateX(-12deg)}
  }
  @keyframes cross{
    from{transform:translate3d(var(--x0),var(--y0),0)}
    to{transform:translate3d(var(--x1),var(--y1),0)}
  }

  /* page shell */
  .wrap{
    position:relative;z-index:3;
    width:100%;max-width:560px;
    margin:0 auto;
    padding:clamp(46px,10vw,84px) var(--gutter) 64px;
  }
  /* scrim: keeps every candle and book behind the words, so text always reads */
  .wrap::before{
    content:"";position:absolute;z-index:-1;
    inset:-14vh -34vw;
    background:radial-gradient(52% 42% at 50% 40%, rgba(11,14,26,.88) 0%, rgba(11,14,26,.62) 46%, rgba(11,14,26,.22) 72%, transparent 88%);
    pointer-events:none;
  }

  /* crest + title */
  .crest{
    width:58px;height:58px;display:block;margin:0 0 20px;
    filter:drop-shadow(0 0 14px rgba(201,162,39,.45));
    animation:seal 1.1s cubic-bezier(.2,.9,.3,1) both;
  }
  @keyframes seal{
    from{opacity:0;transform:scale(1.5) rotate(-12deg)}
    to{opacity:1;transform:none}
  }

  .eyebrow{
    font-family:var(--sc);
    font-size:12.5px;letter-spacing:.26em;
    color:var(--gold);
    margin:0 0 16px;
  }

  h1{
    font-family:var(--display);
    font-size:clamp(52px,15vw,86px);
    font-weight:400;
    line-height:.86;
    letter-spacing:.005em;
    margin:0 0 6px;
    color:var(--parchment);
    text-shadow:0 0 26px rgba(201,162,39,.30);
  }
  h1 .ink{
    display:block;
    background:linear-gradient(92deg,var(--gold),var(--candle) 42%,#FFF0BE 58%,var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  h1 em{
    display:block;font-style:italic;
    font-size:.30em;letter-spacing:.05em;
    color:var(--parchment-dim);
    margin-top:14px;
  }

  .rule{
    height:1px;margin:26px 0 20px;
    background:linear-gradient(90deg,var(--gold),rgba(201,162,39,.25) 45%,transparent);
  }

  .intro{
    font-size:17.5px;line-height:1.62;
    color:var(--parchment-dim);
    max-width:38ch;margin:0 0 40px;
  }
  .intro b{color:var(--parchment);font-weight:600}

  /* link cards: shelved volumes */
  .shelf{display:flex;flex-direction:column;gap:12px}

  .card{
    position:relative;
    display:grid;
    grid-template-columns:50px 1fr 24px;
    gap:16px;align-items:center;
    padding:17px 18px 17px 15px;
    text-decoration:none;color:inherit;
    border:1px solid var(--rule-soft);
    border-left:3px solid var(--oxblood);
    border-radius:3px;
    background:
      linear-gradient(180deg,rgba(232,220,192,.055),rgba(232,220,192,.02));
    transition:transform .38s cubic-bezier(.2,.8,.3,1),border-color .38s,background .38s,box-shadow .38s;
    overflow:hidden;
  }
  /* candle-flare sweep on hover */
  .card::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(105deg,transparent 30%,rgba(245,197,87,.13) 50%,transparent 70%);
    transform:translateX(-120%);
    transition:transform .7s cubic-bezier(.2,.8,.3,1);
    pointer-events:none;
  }
  .card:hover,.card:focus-visible{
    transform:translateX(6px);
    border-color:var(--rule);
    border-left-color:var(--gold);
    background:linear-gradient(180deg,rgba(232,220,192,.10),rgba(232,220,192,.035));
    box-shadow:-6px 0 26px rgba(201,162,39,.16);
  }
  .card:hover::after,.card:focus-visible::after{transform:translateX(120%)}
  .card:focus-visible{outline:2px solid var(--candle);outline-offset:3px}

  .sigil{
    width:50px;height:50px;border-radius:2px;
    display:grid;place-items:center;
    border:1px solid var(--rule);
    background:radial-gradient(circle at 50% 30%, rgba(201,162,39,.18), rgba(10,13,24,.6));
    transition:box-shadow .38s,border-color .38s;
  }
  .sigil svg{width:24px;height:24px;fill:none;stroke:var(--candle);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  .card:hover .sigil,.card:focus-visible .sigil{
    border-color:var(--gold);
    box-shadow:0 0 20px rgba(245,197,87,.35), inset 0 0 14px rgba(245,197,87,.12);
  }

  .top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:3px}
  .name{
    font-family:var(--display);
    font-size:20px;line-height:1.15;color:var(--parchment);
  }
  .tag{
    font-family:var(--sc);
    font-size:10.5px;letter-spacing:.14em;
    color:var(--gold);white-space:nowrap;
  }
  .desc{
    display:block;
    font-size:14.5px;line-height:1.5;
    color:var(--parchment-dim);
  }
  .go{
    font-family:var(--display);
    font-size:19px;color:var(--gold);justify-self:end;
    transition:transform .38s cubic-bezier(.2,.8,.3,1);
  }
  .card:hover .go,.card:focus-visible .go{transform:translateX(4px)}

  /* sealed / not yet live */
  .card.sealed{
    opacity:.55;border-left-color:var(--parchment-dim);
    border-style:dashed;cursor:default;
  }
  .card.sealed .tag{color:var(--parchment-dim)}
  .card.sealed .sigil svg{stroke:var(--parchment-dim)}

  .empty{
    padding:30px 24px;
    border:1px dashed var(--rule);border-radius:3px;
    color:var(--parchment-dim);line-height:1.65;font-size:16px;
  }
  .empty b{color:var(--parchment)}

  footer{
    margin-top:44px;padding-top:22px;
    border-top:1px solid var(--rule-soft);
    font-family:var(--sc);
    font-size:11.5px;letter-spacing:.16em;
    color:rgba(169,160,136,.6);
  }

  /* entrance */
  .rise{opacity:0;transform:translateY(16px);animation:rise .95s cubic-bezier(.2,.8,.3,1) forwards}
  @keyframes rise{to{opacity:1;transform:none}}

  @media (max-width:400px){
    :root{--gutter:16px}
    body{font-size:16px}
    .card{grid-template-columns:42px 1fr 20px;gap:13px;padding:15px}
    .sigil{width:42px;height:42px}
    .sigil svg{width:21px;height:21px}
    .name{font-size:18px}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
    }
    .rise{opacity:1;transform:none}
    .flock,.motes{display:none}
  }
</style>
</head>
<body>

<div class="hall" aria-hidden="true"></div>
<div class="motes" aria-hidden="true"></div>
<div class="candles" id="candles" aria-hidden="true"></div>
<div class="flock" id="flock" aria-hidden="true"></div>

<main class="wrap">

  <header>
    <svg class="crest" viewBox="0 0 64 64" aria-hidden="true">
      <path d="M32 3 58 13v22c0 14-11 23-26 26C17 58 6 49 6 35V13z"
            fill="none" stroke="#C9A227" stroke-width="1.6"/>
      <path d="M32 3 58 13v22c0 14-11 23-26 26C17 58 6 49 6 35V13z"
            fill="rgba(201,162,39,.07)" stroke="none"/>
      <path d="M32 12v34" stroke="rgba(201,162,39,.5)" stroke-width="1"/>
      <path d="M18 21c6-2 11-1 14 3 3-4 8-5 14-3v20c-6-2-11-1-14 3-3-4-8-5-14-3z"
            fill="none" stroke="#F5C557" stroke-width="1.5" stroke-linejoin="round"/>
    </svg>

    <p class="eyebrow rise" style="animation-delay:.15s">Admissions counselling &middot; India</p>
    <h1 class="rise" style="animation-delay:.28s">
      <span class="ink">College</span>
      <span class="ink">Mantra</span>
      <em>every link, one place</em>
    </h1>
    <div class="rule rise" style="animation-delay:.42s"></div>
    <p class="intro rise" style="animation-delay:.5s">
      The whole shelf &mdash; dashboards, playbooks and working tools. Choose a volume.
    </p>
  </header>

  <nav class="shelf" id="shelf" aria-label="Links"></nav>

  <footer class="rise" style="animation-delay:.9s">Updated as new volumes are shelved</footer>

</main>

<script>
"use strict";

/* flying books */
(function flock(){
  var host = document.getElementById("flock");
  if(!host) return;
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  var W = window.innerWidth, H = window.innerHeight;
  var small = W < 620;
  var COUNT = small ? 5 : 9;
  var frag = document.createDocumentFragment();

  for(var i=0;i<COUNT;i++){
    var size = (small ? 26 : 34) + Math.random()* (small ? 16 : 30);
    var dur  = 26 + Math.random()*26;
    var delay = -Math.random()*dur;
    var flapDur = (1.25 + Math.random()*0.9).toFixed(2);

    var ltr = Math.random() > .45;
    var y0 = Math.random()*H*0.86;
    var y1 = y0 + (Math.random()*260 - 130);
    var x0 = ltr ? -size*3 : W + size*2;
    var x1 = ltr ? W + size*2 : -size*3;

    var f = document.createElement("div");
    f.className = "flyer";
    f.style.setProperty("--x0", x0 + "px");
    f.style.setProperty("--y0", y0 + "px");
    f.style.setProperty("--x1", x1 + "px");
    f.style.setProperty("--y1", y1 + "px");
    f.style.animationDuration = dur + "s";
    f.style.animationDelay = delay + "s";
    f.style.opacity = (0.45 + Math.random()*0.45).toFixed(2);

    var b = document.createElement("div");
    b.className = "book";
    b.style.width = size + "px";
    b.style.height = (size*0.74) + "px";
    b.style.animationDuration = (7 + Math.random()*6).toFixed(1) + "s";

    b.innerHTML =
      '<div class="wing l"></div>' +
      '<div class="wing r"></div>' +
      '<div class="leaf l"></div>' +
      '<div class="leaf r"></div>' +
      '<div class="spine"></div>';

    var parts = b.querySelectorAll(".wing, .leaf");
    for(var p=0;p<parts.length;p++){
      parts[p].style.animationDuration = flapDur + "s";
    }

    f.appendChild(b);
    frag.appendChild(f);
  }
  host.appendChild(frag);
})();

/* floating candles */
(function candles(){
  var host = document.getElementById("candles");
  if(!host) return;
  var W = window.innerWidth;
  var COUNT = W < 620 ? 6 : 11;
  var frag = document.createDocumentFragment();
  for(var i=0;i<COUNT;i++){
    var c = document.createElement("div");
    c.className = "candle bob";
    /* hold candles in the side margins - the centre belongs to the words */
    var leftSide = i % 2 === 0;
    var edge = W < 620 ? 15 : 26;
    c.style.left = leftSide
      ? (1 + Math.random()*edge) + "%"
      : (100 - edge + Math.random()*(edge - 2)) + "%";
    c.style.top  = (4 + Math.random()*74) + "%";
    c.style.animationDuration = (6 + Math.random()*6).toFixed(1) + "s";
    c.style.animationDelay = (-Math.random()*6).toFixed(1) + "s";
    c.style.opacity = (0.4 + Math.random()*0.5).toFixed(2);
    var fd = (2.1 + Math.random()*1.4).toFixed(2) + "s";
    c.innerHTML =
      '<span class="halo" style="animation-duration:'+fd+'"></span>' +
      '<span class="flame" style="animation-duration:'+fd+'"></span>' +
      '<span class="stick" style="height:'+(18+Math.random()*20).toFixed(0)+'px"></span>';
    frag.appendChild(c);
  }
  host.appendChild(frag);
})();

/* icons */
var ICONS = {
  book:   '<path d="M4 4.5h6a2.5 2.5 0 0 1 2.5 2.5v13a2 2 0 0 0-2-2H4z"/><path d="M20 4.5h-6A2.5 2.5 0 0 0 11.5 7v13a2 2 0 0 1 2-2H20z"/>',
  scroll: '<path d="M7 4h11a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6"/><path d="M7 4a2 2 0 0 0-2 2v2h4"/><path d="M9 12h8M9 16h6"/>',
  wand:   '<path d="M5 19 17 7"/><path d="M15 5.5 16 3l1 2.5L19.5 6 17 7l-1 2.5L15 7l-2.5-1z"/><path d="M19 15.5l.6 1.5 1.5.6-1.5.6-.6 1.5-.6-1.5-1.5-.6 1.5-.6z"/>',
  orb:    '<circle cx="12" cy="10" r="6"/><path d="M6.5 17.5 5 21h14l-1.5-3.5"/><path d="M9.6 8.4a3.4 3.4 0 0 1 2.6-1.6"/>',
  potion: '<path d="M10 3h4"/><path d="M11 3v5.2L6.6 16A3 3 0 0 0 9.2 20.5h5.6A3 3 0 0 0 17.4 16L13 8.2V3"/><path d="M8 15h8"/>',
  key:    '<circle cx="8" cy="12" r="3.5"/><path d="M11.5 12H21"/><path d="M18 12v3M15 12v2.5"/>',
  quill:  '<path d="M4 20c6-1 9-4 11-8s3-6 5-8c-1 6-2 9-4 12s-6 5-12 4z"/><path d="M4 20l5-5"/>',
  star:   '<path d="M12 3.5 14.4 9l5.6.5-4.3 3.8 1.3 5.6L12 15.9l-5 3 1.3-5.6L4 9.5 9.6 9z"/>'
};

function iconFor(item){
  var s = ((item.name||"") + " " + (item.desc||"") + " " + (item.tag||"")).toLowerCase();
  if(/dashboard|desk|master/.test(s))            return ICONS.orb;
  if(/playbook|marketing|campaign|hook/.test(s)) return ICONS.wand;
  if(/pdf|catalogue|catalog|guide|doc/.test(s))  return ICONS.scroll;
  if(/skill|toolkit|agent|plugin/.test(s))       return ICONS.potion;
  if(/repo|github|code/.test(s))                 return ICONS.book;
  if(/form|apply|admission|enquir/.test(s))      return ICONS.quill;
  if(/whatsapp|contact|call|phone/.test(s))      return ICONS.key;
  return ICONS.star;
}

/* render */
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function cardHTML(item, i){
  var delay = (0.60 + i*0.08).toFixed(2);
  var name = item.name || "Untitled";
  var url  = item.url  || "";
  var tag  = item.tag  || "";
  var desc = item.desc || "";
  var sealed = !url || url === "PENDING_UPLOAD";

  var sigil = '<span class="sigil" aria-hidden="true"><svg viewBox="0 0 24 24">' + iconFor(item) + '</svg></span>';
  var body =
      sigil
    + '<span><span class="top"><span class="name">' + esc(name) + '</span>'
    + (tag ? '<span class="tag">' + esc(tag) + '</span>' : '')
    + '</span><span class="desc">' + esc(desc) + '</span></span>';

  if(sealed){
    return '<div class="card sealed rise" style="animation-delay:' + delay + 's" aria-disabled="true">'
      + body + '<span class="go" aria-hidden="true">&#8226;</span></div>';
  }
  return '<a class="card rise" style="animation-delay:' + delay + 's" href="' + esc(url) + '" target="_blank" rel="noopener">'
    + body + '<span class="go" aria-hidden="true">&rarr;</span></a>';
}

(function load(){
  var shelf = document.getElementById("shelf");
  fetch("links.json", {cache:"no-store"})
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(!Array.isArray(data) || !data.length){
        shelf.innerHTML = '<div class="empty rise" style="animation-delay:.6s">'
          + '<b>The shelf is empty.</b><br />New volumes appear here as they are added.</div>';
        return;
      }
      shelf.innerHTML = data.map(cardHTML).join("");
    })
    .catch(function(){
      shelf.innerHTML = '<div class="empty rise" style="animation-delay:.6s">'
        + '<b>The shelf could not be read.</b><br />Reload the page to try again.</div>';
    });
})();
</script>

</body>
</html>
