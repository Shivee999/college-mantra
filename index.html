<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>College Mantra</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0B0E1A" />
<meta property="og:title" content="College Mantra" />
<meta property="og:description" content="Private. Enter to continue." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<style>
  :root{--night:#0B0E1A;--vault:#0A0D18;--parchment:#E8DCC0;--dim:#A9A088;
   --gold:#C9A227;--candle:#F5C557;--oxblood:#6B1F2A;
   --rule:rgba(201,162,39,.22);--rule-soft:rgba(201,162,39,.10);
   --display:"IM Fell English",Georgia,serif;--sc:"IM Fell English SC",Georgia,serif;--body:"EB Garamond",Georgia,serif;
   --gutter:22px}
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;min-height:100svh;background:var(--night);color:var(--parchment);
   font-family:var(--body);font-size:17px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .hall{position:fixed;inset:0;z-index:0;pointer-events:none;background:
    radial-gradient(70vw 50vh at 50% 108%, rgba(201,162,39,.18), transparent 62%),
    radial-gradient(50vw 40vh at 12% -8%, rgba(46,94,78,.16), transparent 60%),
    radial-gradient(46vw 38vh at 92% 4%, rgba(107,31,42,.20), transparent 62%),
    linear-gradient(180deg,var(--vault),var(--night) 45%,#0D1120)}
  .motes{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.5;background-image:
    radial-gradient(1.4px 1.4px at 12% 22%, rgba(245,197,87,.9), transparent),
    radial-gradient(1.1px 1.1px at 78% 14%, rgba(232,220,192,.8), transparent),
    radial-gradient(1.6px 1.6px at 34% 66%, rgba(245,197,87,.7), transparent),
    radial-gradient(1.2px 1.2px at 62% 82%, rgba(232,220,192,.6), transparent),
    radial-gradient(1.3px 1.3px at 88% 58%, rgba(245,197,87,.65), transparent),
    radial-gradient(1px 1px at 22% 44%, rgba(232,220,192,.7), transparent);
    animation:motes 22s ease-in-out infinite alternate}
  @keyframes motes{from{transform:translate3d(0,0,0)}to{transform:translate3d(14px,-22px,0)}}
  .candles{position:fixed;inset:0;z-index:1;pointer-events:none}
  .candle{position:absolute;width:7px}
  .stick{display:block;width:7px;border-radius:2px;background:linear-gradient(180deg,#F0E6CE,#C9BFA4 60%,#8F866E);box-shadow:0 0 12px rgba(245,197,87,.25)}
  .flame{display:block;width:7px;height:11px;margin:0 auto 2px;border-radius:50% 50% 45% 45%;
   background:radial-gradient(circle at 50% 68%, #FFF3CE, #F5C557 42%, rgba(245,197,87,0) 72%);
   filter:blur(.3px);transform-origin:50% 100%;animation:flicker 2.6s ease-in-out infinite}
  .halo{position:absolute;left:50%;top:-16px;width:52px;height:52px;transform:translateX(-50%);border-radius:50%;
   background:radial-gradient(circle, rgba(245,197,87,.30), transparent 68%);animation:halo 2.6s ease-in-out infinite}
  @keyframes flicker{0%,100%{transform:scaleY(1) skewX(0);opacity:1}30%{transform:scaleY(1.16) skewX(-3deg);opacity:.92}
   55%{transform:scaleY(.94) skewX(2deg);opacity:1}78%{transform:scaleY(1.08) skewX(-1deg);opacity:.95}}
  @keyframes halo{0%,100%{opacity:.55;transform:translateX(-50%) scale(1)}45%{opacity:.85;transform:translateX(-50%) scale(1.14)}}
  .bob{animation:bob 7s ease-in-out infinite alternate}
  @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-16px)}}
  .flock{position:fixed;inset:0;z-index:1;pointer-events:none;perspective:900px}
  .flyer{position:absolute;top:0;left:0;transform-style:preserve-3d;animation-name:cross;
   animation-timing-function:linear;animation-iteration-count:infinite;will-change:transform}
  .bk{position:relative;transform-style:preserve-3d;animation:tumble 9s ease-in-out infinite alternate}
  .spine{position:absolute;left:50%;top:2%;width:4px;height:96%;transform:translateX(-50%) translateZ(0);
   background:linear-gradient(180deg,#8A2A38,#541822);border-radius:1px;box-shadow:0 0 8px rgba(0,0,0,.55),0 0 14px rgba(245,197,87,.18)}
  .wing{position:absolute;top:0;width:50%;height:100%;
   background:linear-gradient(100deg,rgba(255,240,190,.16),rgba(0,0,0,.20)),linear-gradient(180deg,#F6EDD4,#DCCBA2);
   border:1px solid rgba(150,118,52,.5);box-shadow:0 2px 10px rgba(0,0,0,.45),0 0 16px rgba(245,197,87,.10)}
  .wing.l{right:50%;transform-origin:right center;border-radius:3px 1px 1px 3px;animation:flapL 1.5s ease-in-out infinite}
  .wing.r{left:50%;transform-origin:left center;border-radius:1px 3px 3px 1px;animation:flapR 1.5s ease-in-out infinite}
  .leaf{position:absolute;top:6%;height:88%;width:44%;background:repeating-linear-gradient(90deg,#FBF6E8 0 2px,#E4DAC0 2px 3px);opacity:.95}
  .leaf.l{right:50%;transform-origin:right center;animation:flapL 1.5s ease-in-out infinite}
  .leaf.r{left:50%;transform-origin:left center;animation:flapR 1.5s ease-in-out infinite}
  @keyframes flapL{0%,100%{transform:rotateY(-58deg)}50%{transform:rotateY(-16deg)}}
  @keyframes flapR{0%,100%{transform:rotateY(58deg)}50%{transform:rotateY(16deg)}}
  @keyframes tumble{from{transform:rotateZ(-11deg) rotateX(16deg)}to{transform:rotateZ(13deg) rotateX(-12deg)}}
  @keyframes cross{from{transform:translate3d(var(--x0),var(--y0),0)}to{transform:translate3d(var(--x1),var(--y1),0)}}

  /* ---- the gate ---- */
  #gate{position:fixed;inset:0;z-index:9;display:grid;place-items:center;padding:24px;
   background:radial-gradient(60% 50% at 50% 45%, rgba(11,14,26,.90), rgba(11,14,26,.97))}
  #gate.open{animation:unseal .9s cubic-bezier(.4,0,.2,1) forwards;pointer-events:none}
  @keyframes unseal{to{opacity:0;transform:scale(1.06);visibility:hidden}}
  .lock{width:100%;max-width:400px;text-align:center}
  .seal{width:96px;height:96px;margin:0 auto 26px;display:block;
   filter:drop-shadow(0 0 22px rgba(201,162,39,.5));animation:pulse 3.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{filter:drop-shadow(0 0 18px rgba(201,162,39,.40))}50%{filter:drop-shadow(0 0 30px rgba(245,197,87,.65))}}
  .lock h2{font-family:var(--display);font-weight:400;font-size:38px;margin:0 0 8px;color:var(--parchment)}
  .lock p{color:var(--dim);font-size:15.5px;margin:0 0 24px}
  .pw{width:100%;padding:15px 16px;text-align:center;letter-spacing:.3em;
   background:rgba(232,220,192,.06);color:var(--parchment);border:1px solid var(--rule);border-radius:3px;
   font-family:var(--sc);font-size:19px}
  .pw:focus{outline:2px solid var(--candle);outline-offset:2px;border-color:var(--gold)}
  .pw.wrong{animation:shake .45s;border-color:#C0392B}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
  .enter{margin-top:12px;width:100%;padding:14px;cursor:pointer;
   background:linear-gradient(180deg,rgba(201,162,39,.22),rgba(201,162,39,.10));
   color:var(--parchment);border:1px solid var(--gold);border-radius:3px;
   font-family:var(--sc);font-size:13px;letter-spacing:.2em}
  .enter:hover{background:linear-gradient(180deg,rgba(245,197,87,.32),rgba(201,162,39,.16))}
  .err{color:#E8836F;font-family:var(--sc);font-size:12px;letter-spacing:.1em;min-height:18px;margin-top:12px}

  .wrap{position:relative;z-index:3;width:100%;max-width:620px;margin:0 auto;padding:clamp(46px,10vw,84px) var(--gutter) 64px}
  .wrap::before{content:"";position:absolute;z-index:-1;inset:-14vh -34vw;pointer-events:none;
   background:radial-gradient(52% 42% at 50% 40%, rgba(11,14,26,.88) 0%, rgba(11,14,26,.62) 46%, rgba(11,14,26,.22) 72%, transparent 88%)}
  #main{opacity:0}
  #main.in{animation:reveal 1s cubic-bezier(.2,.8,.3,1) .15s forwards}
  @keyframes reveal{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

  .crest{width:58px;height:58px;display:block;margin:0 0 20px;filter:drop-shadow(0 0 14px rgba(201,162,39,.45))}
  .eyebrow{font-family:var(--sc);font-size:12.5px;letter-spacing:.26em;color:var(--gold);margin:0 0 16px}
  h1{font-family:var(--display);font-size:clamp(52px,15vw,86px);font-weight:400;line-height:.86;margin:0 0 6px;
   color:var(--parchment);text-shadow:0 0 26px rgba(201,162,39,.30)}
  h1 .ink{display:block;background:linear-gradient(92deg,var(--gold),var(--candle) 42%,#FFF0BE 58%,var(--gold));
   -webkit-background-clip:text;background-clip:text;color:transparent}
  h1 em{display:block;font-style:italic;font-size:.30em;letter-spacing:.05em;color:var(--dim);margin-top:14px}
  .rule{height:1px;margin:26px 0 20px;background:linear-gradient(90deg,var(--gold),rgba(201,162,39,.25) 45%,transparent)}
  .intro{font-size:17.5px;line-height:1.62;color:var(--dim);max-width:40ch;margin:0 0 40px}

  .sec{margin:0 0 34px}
  .sec-h{display:flex;align-items:baseline;gap:12px;margin:0 0 4px}
  .sec-h b{font-family:var(--sc);font-size:11.5px;letter-spacing:.2em;color:var(--gold)}
  .sec-h i{flex:1;height:1px;background:var(--rule-soft)}
  .sec-n{font-size:14.5px;color:rgba(169,160,136,.75);margin:0 0 14px;font-style:italic}
  .shelf{display:flex;flex-direction:column;gap:11px}
  .card{position:relative;display:grid;grid-template-columns:50px 1fr 24px;gap:16px;align-items:center;
   padding:17px 18px 17px 15px;text-decoration:none;color:inherit;
   border:1px solid var(--rule-soft);border-left:3px solid var(--oxblood);border-radius:3px;
   background:linear-gradient(180deg,rgba(232,220,192,.055),rgba(232,220,192,.02));
   transition:transform .38s cubic-bezier(.2,.8,.3,1),border-color .38s,background .38s,box-shadow .38s;overflow:hidden}
  .card::after{content:"";position:absolute;inset:0;pointer-events:none;
   background:linear-gradient(105deg,transparent 30%,rgba(245,197,87,.13) 50%,transparent 70%);
   transform:translateX(-120%);transition:transform .7s cubic-bezier(.2,.8,.3,1)}
  .card:hover,.card:focus-visible{transform:translateX(6px);border-color:var(--rule);border-left-color:var(--gold);
   background:linear-gradient(180deg,rgba(232,220,192,.10),rgba(232,220,192,.035));box-shadow:-6px 0 26px rgba(201,162,39,.16)}
  .card:hover::after,.card:focus-visible::after{transform:translateX(120%)}
  .card:focus-visible{outline:2px solid var(--candle);outline-offset:3px}
  .sigil{width:50px;height:50px;border-radius:2px;display:grid;place-items:center;border:1px solid var(--rule);
   background:radial-gradient(circle at 50% 30%, rgba(201,162,39,.18), rgba(10,13,24,.6));transition:box-shadow .38s,border-color .38s}
  .sigil svg{width:24px;height:24px;fill:none;stroke:var(--candle);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  .card:hover .sigil{border-color:var(--gold);box-shadow:0 0 20px rgba(245,197,87,.35), inset 0 0 14px rgba(245,197,87,.12)}
  .top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:3px}
  .name{font-family:var(--display);font-size:20px;line-height:1.15;color:var(--parchment)}
  .tag{font-family:var(--sc);font-size:10.5px;letter-spacing:.14em;color:var(--gold);white-space:nowrap}
  .desc{display:block;font-size:14.5px;line-height:1.5;color:var(--dim)}
  .go{font-family:var(--display);font-size:19px;color:var(--gold);justify-self:end;transition:transform .38s cubic-bezier(.2,.8,.3,1)}
  .card:hover .go{transform:translateX(4px)}
  footer{margin-top:40px;padding-top:22px;border-top:1px solid var(--rule-soft);
   font-family:var(--sc);font-size:11.5px;letter-spacing:.16em;color:rgba(169,160,136,.6)}
  @media (max-width:400px){:root{--gutter:16px}body{font-size:16px}
   .card{grid-template-columns:42px 1fr 20px;gap:13px;padding:15px}
   .sigil{width:42px;height:42px}.sigil svg{width:21px;height:21px}.name{font-size:18px}}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms !important;
   animation-iteration-count:1 !important;transition-duration:.001ms !important}
   #main{opacity:1}.flock,.motes{display:none}}
</style>
</head>
<body>
<div class="hall" aria-hidden="true"></div>
<div class="motes" aria-hidden="true"></div>
<div class="candles" id="candles" aria-hidden="true"></div>
<div class="flock" id="flock" aria-hidden="true"></div>

<div id="gate">
  <div class="lock">
    <svg class="seal" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 3 58 13v22c0 14-11 23-26 26C17 58 6 49 6 35V13z" fill="none" stroke="#C9A227" stroke-width="1.6"/><path d="M32 3 58 13v22c0 14-11 23-26 26C17 58 6 49 6 35V13z" fill="rgba(201,162,39,.07)" stroke="none"/><path d="M32 12v34" stroke="rgba(201,162,39,.5)" stroke-width="1"/><path d="M18 21c6-2 11-1 14 3 3-4 8-5 14-3v20c-6-2-11-1-14 3-3-4-8-5-14-3z" fill="none" stroke="#F5C557" stroke-width="1.5" stroke-linejoin="round"/></svg>
    <h2>College Mantra</h2>
    <p>This shelf is private. Enter the word to continue.</p>
    <input class="pw" id="pw" type="password" autocomplete="off" autocapitalize="characters"
           spellcheck="false" placeholder="&#8226; &#8226; &#8226; &#8226; &#8226;" aria-label="Password" />
    <button class="enter" id="go" type="button">ENTER</button>
    <p class="err" id="err"></p>
  </div>
</div>

<main class="wrap" id="main" hidden>
  <header>
    <svg class="crest" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 3 58 13v22c0 14-11 23-26 26C17 58 6 49 6 35V13z" fill="none" stroke="#C9A227" stroke-width="1.6"/><path d="M32 3 58 13v22c0 14-11 23-26 26C17 58 6 49 6 35V13z" fill="rgba(201,162,39,.07)" stroke="none"/><path d="M32 12v34" stroke="rgba(201,162,39,.5)" stroke-width="1"/><path d="M18 21c6-2 11-1 14 3 3-4 8-5 14-3v20c-6-2-11-1-14 3-3-4-8-5-14-3z" fill="none" stroke="#F5C557" stroke-width="1.5" stroke-linejoin="round"/></svg>
    <p class="eyebrow">Admissions counselling &middot; India</p>
    <h1><span class="ink">College</span><span class="ink">Mantra</span><em>every link, one place</em></h1>
    <div class="rule"></div>
    <p class="intro">The whole shelf &mdash; costs, colleges, references and the tooling behind them.</p>
  </header>
  <div id="body"></div>
  <footer>Private &middot; updated as new volumes are shelved</footer>
</main>

<script>
"use strict";
var SEC = [{"t": "Admissions desk", "n": "The working tools — costs, colleges, and the internal master file.", "items": [{"name": "Admission Desk", "url": "https://shivee999.github.io/collegemantra/", "tag": "Master file · PAISAN", "desc": "Every College Mantra chat, artifact, tool and repo compiled into ten sections.", "ic": "<circle cx=\"12\" cy=\"10\" r=\"6\"/><path d=\"M6.5 17.5 5 21h14l-1.5-3.5\"/><path d=\"M9.6 8.4a3.4 3.4 0 0 1 2.6-1.6\"/>"}, {"name": "Cost of Attendance", "url": "https://shivee999.github.io/collegemantra/fees.html", "tag": "Calculator", "desc": "Tuition, hostel and mess for all 23 IITs, 31 NITs, IIITs, AIIMS and regulated MBBS bands, plus a city living-cost engine for any college in India.", "ic": "<path d=\"M4 4v16M20 4v16\"/><path d=\"M4 9h16M4 15h16\"/><circle cx=\"9\" cy=\"9\" r=\"1.6\"/><circle cx=\"15\" cy=\"15\" r=\"1.6\"/>"}, {"name": "College Desk Sheet", "url": "https://shivee999.github.io/collegemantra/desk.html", "tag": "Reference", "desc": "MBBS colleges across Pune, Mumbai and Bangalore with locality rent data and hostel specifics. Blank rows where no published figure exists.", "ic": "<path d=\"M4 20c6-1 9-4 11-8s3-6 5-8c-1 6-2 9-4 12s-6 5-12 4z\"/><path d=\"M4 20l5-5\"/>"}]}, {"t": "Reference", "n": "Converted from documents into working pages.", "items": [{"name": "Skills Catalogue", "url": "catalogue/", "tag": "204 skills · searchable", "desc": "Every skill in the working environment across 16 disciplines, with a suggested use for each. Search by name or purpose.", "ic": "<path d=\"M7 4h11a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6\"/><path d=\"M7 4a2 2 0 0 0-2 2v2h4\"/><path d=\"M9 12h8M9 16h6\"/>"}]}, {"t": "Build tooling", "n": "Repositories behind the automation work.", "items": [{"name": "pm-skills", "url": "https://github.com/Shivee999/pm-skills", "tag": "Repository", "desc": "PM Skills Marketplace — 100+ agentic skills, commands and plugins across discovery, strategy, execution, launch and growth.", "ic": "<path d=\"M10 3h4\"/><path d=\"M11 3v5.2L6.6 16A3 3 0 0 0 9.2 20.5h5.6A3 3 0 0 0 17.4 16L13 8.2V3\"/><path d=\"M8 15h8\"/>"}, {"name": "awesome-claude-code-toolkit", "url": "https://github.com/Shivee999/awesome-claude-code-toolkit", "tag": "Repository", "desc": "135 agents, 35 curated skills, 42 commands, 176+ plugins, 20 hooks, 15 rules, 14 MCP configs.", "ic": "<path d=\"M10 3h4\"/><path d=\"M11 3v5.2L6.6 16A3 3 0 0 0 9.2 20.5h5.6A3 3 0 0 0 17.4 16L13 8.2V3\"/><path d=\"M8 15h8\"/>"}, {"name": "paperclip", "url": "https://github.com/Shivee999/paperclip", "tag": "Repository", "desc": "Open-source app for managing agents at work.", "ic": "<path d=\"M4 4.5h6a2.5 2.5 0 0 1 2.5 2.5v13a2 2 0 0 0-2-2H4z\"/><path d=\"M20 4.5h-6A2.5 2.5 0 0 0 11.5 7v13a2 2 0 0 1 2-2H20z\"/>"}, {"name": "Skill Stacks", "url": "https://shivee999.github.io/skill-stacks/", "tag": "Storefront", "desc": "950 skills across 13 stacks, sourced and deduplicated from GitHub.", "ic": "<path d=\"M4 4.5h6a2.5 2.5 0 0 1 2.5 2.5v13a2 2 0 0 0-2-2H4z\"/><path d=\"M20 4.5h-6A2.5 2.5 0 0 0 11.5 7v13a2 2 0 0 1 2-2H20z\"/>"}, {"name": "Build Ledger", "url": "https://shivee999.github.io/ledger/", "tag": "Index", "desc": "Every artefact built to date, in two stacks.", "ic": "<path d=\"M7 4h11a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6\"/><path d=\"M7 4a2 2 0 0 0-2 2v2h4\"/><path d=\"M9 12h8M9 16h6\"/>"}]}, {"t": "People", "n": "", "items": [{"name": "Vineet", "url": "https://www.instagram.com/vineett.__", "tag": "Founder", "desc": "Founder, College Mantra.", "ic": "<circle cx=\"8\" cy=\"12\" r=\"3.5\"/><path d=\"M11.5 12H21\"/><path d=\"M18 12v3M15 12v2.5\"/>"}]}];
var HASH = "8d4b6a237bc1f8c4ffb1253f83268dc74d6c9d48c1387cf1436d6e6e45b4aab7";

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

function build(){
  var out="";
  SEC.forEach(function(sec){
    out+='<section class="sec"><div class="sec-h"><b>'+esc(sec.t)+'</b><i></i></div>';
    if(sec.n) out+='<p class="sec-n">'+esc(sec.n)+'</p>';
    out+='<div class="shelf">';
    sec.items.forEach(function(it){
      var ext = it.url.indexOf("http")===0 ? ' target="_blank" rel="noopener"' : '';
      out+='<a class="card" href="'+esc(it.url)+'"'+ext+'>'
        + '<span class="sigil" aria-hidden="true"><svg viewBox="0 0 24 24">'+it.ic+'</svg></span>'
        + '<span><span class="top"><span class="name">'+esc(it.name)+'</span>'
        + '<span class="tag">'+esc(it.tag)+'</span></span>'
        + '<span class="desc">'+esc(it.desc)+'</span></span>'
        + '<span class="go" aria-hidden="true">&rarr;</span></a>';
    });
    out+='</div></section>';
  });
  document.getElementById("body").innerHTML = out;
}

async function sha(t){
  var b = new TextEncoder().encode(t);
  var h = await crypto.subtle.digest("SHA-256", b);
  return Array.from(new Uint8Array(h)).map(function(x){return x.toString(16).padStart(2,"0");}).join("");
}

async function tryOpen(){
  var el=document.getElementById("pw"), err=document.getElementById("err");
  var v=(el.value||"").trim().toUpperCase();
  if(!v){ el.focus(); return; }
  var ok=false;
  try{ ok = (await sha(v)) === HASH; }catch(e){ ok=false; }
  if(ok){ try{sessionStorage.setItem("cm_ok","1");}catch(e){} reveal(); }
  else{
    err.textContent="NOT THE WORD";
    el.classList.remove("wrong"); void el.offsetWidth; el.classList.add("wrong");
    el.select();
  }
}

function reveal(){
  var g=document.getElementById("gate"), m=document.getElementById("main");
  build(); m.hidden=false; m.classList.add("in"); g.classList.add("open");
  setTimeout(function(){ g.style.display="none"; }, 900);
}

document.getElementById("go").addEventListener("click", tryOpen);
document.getElementById("pw").addEventListener("keydown", function(e){ if(e.key==="Enter") tryOpen(); });

var seen=false;
try{ seen = sessionStorage.getItem("cm_ok")==="1"; }catch(e){}
if(seen){
  document.getElementById("gate").style.display="none";
  build();
  var m=document.getElementById("main"); m.hidden=false; m.classList.add("in");
} else {
  document.getElementById("pw").focus();
}

(function(){
  var host=document.getElementById("flock");
  if(!host || (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches)) return;
  var W=window.innerWidth,H=window.innerHeight,small=W<620,N=small?5:9,frag=document.createDocumentFragment();
  for(var i=0;i<N;i++){
    var size=(small?26:34)+Math.random()*(small?16:30), dur=26+Math.random()*26,
        fd=(1.25+Math.random()*0.9).toFixed(2), ltr=Math.random()>.45,
        y0=Math.random()*H*0.86, y1=y0+(Math.random()*260-130),
        x0=ltr?-size*3:W+size*2, x1=ltr?W+size*2:-size*3;
    var f=document.createElement("div"); f.className="flyer";
    f.style.setProperty("--x0",x0+"px"); f.style.setProperty("--y0",y0+"px");
    f.style.setProperty("--x1",x1+"px"); f.style.setProperty("--y1",y1+"px");
    f.style.animationDuration=dur+"s"; f.style.animationDelay=(-Math.random()*dur)+"s";
    f.style.opacity=(0.45+Math.random()*0.45).toFixed(2);
    var b=document.createElement("div"); b.className="bk";
    b.style.width=size+"px"; b.style.height=(size*0.74)+"px";
    b.style.animationDuration=(7+Math.random()*6).toFixed(1)+"s";
    b.innerHTML='<div class="wing l"></div><div class="wing r"></div><div class="leaf l"></div><div class="leaf r"></div><div class="spine"></div>';
    var ps=b.querySelectorAll(".wing,.leaf");
    for(var p=0;p<ps.length;p++){ ps[p].style.animationDuration=fd+"s"; }
    f.appendChild(b); frag.appendChild(f);
  }
  host.appendChild(frag);
})();

(function(){
  var host=document.getElementById("candles"); if(!host) return;
  var W=window.innerWidth,N=W<620?6:11,frag=document.createDocumentFragment();
  for(var i=0;i<N;i++){
    var c=document.createElement("div"); c.className="candle bob";
    var edge=W<620?15:26;
    c.style.left=(i%2===0)?(1+Math.random()*edge)+"%":(100-edge+Math.random()*(edge-2))+"%";
    c.style.top=(4+Math.random()*74)+"%";
    c.style.animationDuration=(6+Math.random()*6).toFixed(1)+"s";
    c.style.animationDelay=(-Math.random()*6).toFixed(1)+"s";
    c.style.opacity=(0.4+Math.random()*0.5).toFixed(2);
    var fd=(2.1+Math.random()*1.4).toFixed(2)+"s";
    c.innerHTML='<span class="halo" style="animation-duration:'+fd+'"></span>'
      +'<span class="flame" style="animation-duration:'+fd+'"></span>'
      +'<span class="stick" style="height:'+(18+Math.random()*20).toFixed(0)+'px"></span>';
    frag.appendChild(c);
  }
  host.appendChild(frag);
})();
</script>
</body>
</html>
